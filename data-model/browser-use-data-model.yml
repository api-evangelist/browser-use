description: >-
  Entity graph of the Browser Use Cloud v4 API. Two independent trees hang off a project: the AGENT
  tree (workspace → session → run → events/attachments/queue) and the BROWSER tree (browser session,
  optionally linked back to an agent session). Profiles are shared authentication state that either
  tree can attach.
identifiers:
  format: UUID
  prefixed: false
  note: >-
    Every id in v4 is a bare UUID with no type prefix, so an id carries no information about what it
    points at. An agent holding a loose id cannot tell a run from a session from a workspace.
entity_count: 9
