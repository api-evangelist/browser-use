  operations: [create_workspace_workspaces_post, get_workspace_workspaces__workspace_id__get, update_workspace_workspaces__workspace_id__patch, delete_workspace_workspaces__workspace_id__delete, get_workspace_size_workspaces__workspace_id__size_get]
  note: Persistent file store shared across runs and conversations. Delete archives rather than hard-deletes.
