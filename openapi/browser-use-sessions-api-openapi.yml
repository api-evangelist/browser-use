    BuModel:
      type: string
      enum:
      - bu-mini
      - bu-max
      - bu-ultra
      - gemini-3-flash
      - claude-opus-4.6
      - claude-opus-4.7
      - claude-sonnet-5
      - claude-opus-4.8
      - gpt-5.4-mini
      - glm-5.2
      - minimax-m3
      - claude-haiku-4.5
      - gpt-5.2
      - gpt-5-mini
      - gpt-5.5
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
      - gemini-3-pro
      - gemini-3.1-pro
      - gemini-3.5-flash
      title: BuModel
      description: 'The model to use for the agent. Each model has different capabilities and pricing.


        - `bu-mini` / `gemini-3-flash`: Gemini 3 Flash — fast and cost-effective. Best for simple, well-defined tasks like form filling or data extraction.

        - `bu-max` / `claude-sonnet-4.6` (legacy aliases) / `claude-sonnet-5`: Claude Sonnet 5 — balanced performance. Best for multi-step workflows that require reasoning and decision-making.

        - `bu-ultra` / `claude-opus-4.6`: Claude Opus 4.6 — capable general-purpose Opus tier.

        - `claude-opus-4.7`: Claude Opus 4.7 — most capable. Best for complex tasks that require advanced reasoning, long-horizon planning, or handling ambiguous instructions.

        - `claude-opus-4.8`: Claude Opus 4.8 — most capable Opus-tier model, state-of-the-art on long-horizon agentic work.

        - `gpt-5.4-mini`: GPT-5.4 mini — OpenAI''s fast and efficient model. Best for tasks that benefit from OpenAI''s capabilities.

        - `glm-5.2`: Z.ai GLM 5.2 — capable, low-cost open model. Best for cost-sensitive agentic tasks.

        - `minimax-m3`: MiniMax M3 — fast, very low-cost model. Best for simple, high-volume tasks.


        Additional provider models (e.g. `gemini-3.5-flash`, `gpt-5.2`, and `gpt-5-mini`)

        are selectable only with `use_own_key=true`, where your own provider key serves

        them. The GPT-5.6 family is native when either Browser Use''s direct OpenAI key

        or Amazon Bedrock route is configured. GPT-5.5 becomes native only through the

        Bedrock rollout.'
    SessionResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique session identifier.
        status:
          $ref: '#/components/schemas/BuAgentSessionStatus'
          description: 'Current session lifecycle status. Progresses through: `created` (sandbox starting) → `idle` (ready, waiting for task) → `running` (task executing) → `stopped` / `timed_out` / `error`. Poll this field to track progress.'
        model:
          $ref: '#/components/schemas/BuModel'
          description: The model tier used for this session.
        thinkingLevel:
          anyOf:
          - $ref: '#/components/schemas/ThinkingLevel'
          - type: 'null'
          description: Configured model reasoning depth for this session, or null when provider defaults are used.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Auto-generated short title summarizing the task. Available after the task starts running.
        output:
          anyOf:
          - {}
          - type: 'null'
          title: Output
          description: The agent's final output. If `codeMode` was true, this will be an object with `text` (summary), `code` (Python source), and optionally `output` (execution result). If `outputSchema` was provided, this will be structured data conforming to that schema. Otherwise it may be a free-form string or null.
        outputSchema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Outputschema
          description: The JSON Schema that was requested for structured output, if any.
        stepCount:
          type: integer
          title: Stepcount
          description: Number of steps the agent has executed so far.
          default: 0
        lastStepSummary:
          anyOf:
          - type: string
          - type: 'null'
          title: Laststepsummary
          description: Human-readable summary of the most recent agent step (e.g. "Clicking the Submit button"). Useful for showing real-time progress.
        isTaskSuccessful:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Istasksuccessful
          description: Whether the task completed successfully. `true` if the agent achieved the goal, `false` if it failed or gave up, `null` if the task is still running or no task was dispatched.
        liveUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Liveurl
          description: URL to view the live browser session. Available immediately on session creation — can be embedded in an iframe to show the browser in real time.
        recordingUrls:
          items:
            type: string
          type: array
          title: Recordingurls
          description: URLs to download session recordings. Only populated on `GET /api/v3/sessions/{id}`; always `[]` in list responses.
          default: []
        profileId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Profileid
          description: ID of the browser profile loaded in this session, if any.
        workspaceId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workspaceid
          description: ID of the workspace attached to this session, if any.
        proxyCountryCode:
          anyOf:
          - $ref: '#/components/schemas/ProxyCountryCode'
          - type: 'null'
          description: Country code of the proxy used for this session, or null if no proxy.
        browserScreenWidth:
          anyOf:
          - type: integer
          - type: 'null'
          title: Browserscreenwidth
          description: Custom browser screen width set for this session, or null for the default.
        browserScreenHeight:
          anyOf:
          - type: integer
          - type: 'null'
          title: Browserscreenheight
          description: Custom browser screen height set for this session, or null for the default.
        maxCostUsd:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Maxcostusd
          description: Maximum cost limit in USD set for this session.
        totalInputTokens:
          type: integer
          title: Totalinputtokens
          description: Total LLM input tokens consumed by this session.
          default: 0
        totalOutputTokens:
          type: integer
          title: Totaloutputtokens
          description: Total LLM output tokens consumed by this session.
          default: 0
        proxyUsedMb:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Proxyusedmb
          description: Proxy bandwidth used in megabytes.
          default: '0'
        llmCostUsd:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Llmcostusd
          description: Cost of LLM usage in USD.
          default: '0'
        proxyCostUsd:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Proxycostusd
          description: Cost of proxy bandwidth in USD.
          default: '0'
        browserCostUsd:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Browsercostusd
          description: Cost of browser compute time in USD.
          default: '0'
        totalCostUsd:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Totalcostusd
          description: Total session cost in USD (LLM + proxy + browser).
          default: '0'
        screenshotUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Screenshoturl
          description: Presigned URL of the latest screenshot (expires after 5 minutes). Only populated on `GET /api/v3/sessions/{id}`; always `null` in list responses.
        agentmailEmail:
          anyOf:
          - type: string
          - type: 'null'
          title: Agentmailemail
          description: Temporary email address provisioned for this session (via AgentMail). Only present if `agentmail` was enabled.
        integrationsUsed:
          items:
            type: string
          type: array
          title: Integrationsused
          description: List of integration providers used during this session (e.g. ["gmail", "slack", "agentmail"]).
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the session was created.
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: When the session was last updated.
      type: object
      required:
      - id
      - status
      - model
      - createdAt
      - updatedAt
      title: SessionResponse
      description: 'Represents a session and its current state.


        Poll this endpoint to track task progress. The `status` field indicates the session lifecycle stage,

        and `output` contains the agent''s structured result once the task completes.'
    SessionListResponse_2:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SessionResponse'
          type: array
          title: Sessions
          description: List of sessions.
        total:
