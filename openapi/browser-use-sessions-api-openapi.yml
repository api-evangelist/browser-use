openapi: 3.2.0
info:
  title: Browser Use Sessions API
  version: '1.0'
  description: 'Operations tagged Sessions across 3 of this provider''s published API definitions: browser-use-api-v2-openapi.json, browser-use-api-v3-openapi.json, browser-use-api-v4-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.browser-use.com/api/v2
  description: Production server
- url: https://api.browser-use.com/api/v3
  description: Production server
- url: https://api.browser-use.com/api/v4
  description: Production server
tags:
- name: Sessions
paths:
  /sessions:
    get:
      tags:
      - Sessions
      summary: List Sessions
      description: Get paginated list of AI agent sessions with optional status filtering.
      operationId: list_sessions_sessions_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Pagesize
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Pagenumber
      - name: filterBy
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SessionStatus'
          - type: 'null'
          title: Filterby
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Sessions
      summary: Create Session
      description: Create a new session with a new task.
      operationId: create_session_sessions_post
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
              default:
                proxyCountryCode: us
                persistMemory: true
                keepAlive: true
                enableRecording: false
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionItemView'
        '402':
          description: Insufficient credits to start a session
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileNotFoundError'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many concurrent active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyConcurrentActiveSessionsError'
    servers:
    - url: https://api.browser-use.com/api/v2
      description: Production server
  /sessions/{session_id}:
    get:
      tags:
      - Sessions
      summary: Get Session
      description: Get detailed session information including status, URLs, and task details.
      operationId: get_session_sessions__session_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Sessions
      summary: Update Session
      description: Stop a session and all its running tasks.
      operationId: update_session_sessions__session_id__patch
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFoundError'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      tags:
      - Sessions
      summary: Delete Session
      description: Delete a session with all its tasks.
      operationId: delete_session_sessions__session_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.browser-use.com/api/v2
      description: Production server
  /sessions/{session_id}/purge:
    post:
      tags:
      - Sessions
      summary: Purge Session
      description: 'Immediately purge all data for a session (ZDR projects only).


        Redacts PII from database records and deletes all S3 objects (screenshots,

        output files, uploaded files, logs, history, downloads, agent state) for the

        given session. This is the same cleanup the ZDR cron performs, but on-demand

        and scoped to a single session with no grace period.'
      operationId: purge_session_sessions__session_id__purge_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Project is not ZDR-enabled
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.browser-use.com/api/v2
      description: Production server
  /sessions/{session_id}/public-share:
    get:
      tags:
      - Sessions
      summary: Get Session Public Share
      description: Get public share information including URL and usage statistics.
      operationId: get_session_public_share_sessions__session_id__public_share_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareView'
        '404':
          description: Session or share not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SessionNotFoundError'
                - $ref: '#/components/schemas/ShareNotFoundError'
                title: Response 404 Get Session Public Share Sessions  Session Id  Public Share Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Sessions
      summary: Create Session Public Share
      description: Create or return existing public share for a session.
      operationId: create_session_public_share_sessions__session_id__public_share_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareView'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Sessions
      summary: Delete Session Public Share
      description: Remove public share for a session.
      operationId: delete_session_public_share_sessions__session_id__public_share_delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.browser-use.com/api/v2
      description: Production server
  /sessions/{session_id}/stop:
    post:
      tags:
      - Sessions
      summary: Stop Session
      description: 'Stop a session or the running task.


        - strategy=session (default): destroy sandbox entirely, session → stopped.

        - strategy=task: stop the running query, session stays alive (→ idle).'
      operationId: stop_session_sessions__session_id__stop_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/StopSessionRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.browser-use.com/api/v3
      description: Production server
  /sessions/{session_id}/messages:
    get:
      tags:
      - Sessions
      summary: List Session Messages
      description: Return messages for a session with cursor-based pagination (chronological order).
      operationId: list_session_messages_sessions__session_id__messages_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 'Cursor: return messages after this message ID'
          title: After
        description: 'Cursor: return messages after this message ID'
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 'Cursor: return messages before this message ID'
          title: Before
        description: 'Cursor: return messages before this message ID'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of messages to return (max 100).
          default: 10
          title: Limit
        description: Maximum number of messages to return (max 100).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.browser-use.com/api/v3
      description: Production server
  /sessions/{session_id}/queue:
    post:
      tags:
      - Sessions
      summary: Queue Session Message
      description: 'Send a message to a session. If the session is busy it waits on the queue

        and runs as the next turn; if idle it drains immediately.


        `interrupt=true` cancels the session''s active run so this message takes effect

        now instead of waiting for the current turn (no-op when the session is idle).'
      operationId: queue_session_message_sessions__session_id__queue_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedMessage'
        '403':
          description: Zero Data Retention is enabled on the project (V4 unsupported).
        '404':
          description: Run, session, workspace, or profile not found.
        '429':
          description: The session message queue is full.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Sessions
      summary: List Session Queue
      description: 'List open messages, the latest handoff row, and all steering cutoffs.


        Includes live dispatch claims so clients can restore an accepted steering

        handoff after a refresh without briefly losing its waiting state. The latest

        consumed interrupt bridges the primary-write/read-replica gap before its

        replacement run appears; clients discard it once that run is visible. Compact

        per-source cutoffs preserve every historical interrupted transcript boundary

        without returning every historical steering message and its attachments.'
      operationId: list_session_queue_sessions__session_id__queue_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueListResponse'
        '403':
          description: Zero Data Retention is enabled on the project (V4 unsupported).
        '404':
          description: Run, session, workspace, or profile not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.browser-use.com/api/v4
      description: Production server
  /sessions/{session_id}/queue/{message_id}:
    get:
      tags:
      - Sessions
      summary: Get Session Queue Message
      description: Read one queued message including terminal handoff states.
      operationId: get_session_queue_message_sessions__session_id__queue__message_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          title: Message Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedMessage'
        '403':
          description: Zero Data Retention is enabled on the project (V4 unsupported).
        '404':
          description: Run, session, workspace, or profile not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Sessions
      summary: Cancel Queued Message
      description: Remove a still-pending queued message; 409 once the drain has claimed it.
      operationId: cancel_queued_message_sessions__session_id__queue__message_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          title: Message Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedMessage'
        '403':
          description: Zero Data Retention is enabled on the project (V4 unsupported).
        '404':
          description: Run, session, workspace, or profile not found.
        '409':
          description: The message is no longer pending and cannot be cancelled.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.browser-use.com/api/v4
      description: Production server
components:
  schemas:
    ShareView:
      properties:
        shareToken:
          type: string
          title: Share Token
          description: Token to access the public share
        shareUrl:
          type: string
          title: Share URL
          description: URL to access the public share
        viewCount:
          type: integer
          title: View Count
          description: Number of times the public share has been viewed
        lastViewedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Viewed At
          description: Timestamp of the last time the public share was viewed (None if never viewed)
      type: object
      required:
      - shareToken
      - shareUrl
      - viewCount
      title: ShareView
      description: View model for representing a public share of a session.
    CreateSessionRequest:
      properties:
        profileId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Profile ID
          description: The ID of the profile to use for the session
        proxyCountryCode:
          anyOf:
          - $ref: '#/components/schemas/ProxyCountryCode'
          - type: 'null'
          title: Proxy Country Code
          description: Country code for proxy location. Defaults to US. Set to null to disable proxy.
          default: us
        startUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Start URL
          description: URL to navigate to when the session starts.
        browserScreenWidth:
          anyOf:
          - type: integer
            maximum: 6144.0
            minimum: 320.0
          - type: 'null'
          title: Browser Screen Width
          description: Custom screen width in pixels for the browser.
        browserScreenHeight:
          anyOf:
          - type: integer
            maximum: 3456.0
            minimum: 320.0
          - type: 'null'
          title: Browser Screen Height
          description: Custom screen height in pixels for the browser.
        persistMemory:
          type: boolean
          title: Persist Memory
          description: If True (default), tasks in this session share memory and history with each other, allowing follow-up tasks to continue from previous context. If False, each task runs as a standalone task without any previous task context.
          default: true
        keepAlive:
          type: boolean
          title: Keep Alive
          description: If True (default), the browser session stays alive after tasks complete, allowing follow-up tasks. If False, the session is closed immediately after task completion. Set to False for simple one-off tasks to reduce session idle time.
          default: true
        customProxy:
          anyOf:
          - $ref: '#/components/schemas/CustomProxy'
          - type: 'null'
          title: Custom Proxy
          description: Custom proxy settings to use for the session. If not provided, our proxies will be used. Custom proxies are available on any active subscription.
        enableRecording:
          type: boolean
          title: Enable Recording
          description: If True, enables session recording. Defaults to False.
          default: false
      type: object
      title: CreateSessionRequest
      description: Request model for creating a session.
