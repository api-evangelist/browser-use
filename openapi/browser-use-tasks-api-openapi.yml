openapi: 3.2.0
info:
  title: Browser Use Public API v2 Tasks API
  summary: Browser Use API for running web agents (v2)
  version: 2.0.0
servers:
- url: https://api.browser-use.com/api/v2
  description: Production server
tags:
- name: Tasks
paths:
  /tasks:
    get:
      tags:
      - Tasks
      summary: List Tasks
      description: Get paginated list of AI agent tasks with optional filtering by session and status.
      operationId: list_tasks_tasks_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Pagesize
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Pagenumber
      - name: sessionId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Sessionid
      - name: filterBy
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TaskStatus'
          - type: 'null'
          title: Filterby
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: After
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Tasks
      summary: Create Task
      description: 'Create and start a new task.


        You can either:

        1. Start a new task without a sessionId (auto-creates a session with US proxy by default).

        Note: Tasks without a sessionId are one-off tasks that automatically close the session

        upon completion (keep_alive=false). Use sessionSettings to configure the auto-created

        session (e.g. proxyCountryCode, profileId, screen dimensions).

        2. Start a new task in an existing session (reuse for follow-up tasks or custom configuration)


        Note: Without sessionSettings, a US proxy is enabled by default. Providing sessionSettings

        overrides defaults — proxy is only enabled if proxyCountryCode is set. For full control over

        session configuration (e.g. keep_alive), create a session first via POST /sessions with your

        desired settings, then pass that sessionId when creating tasks.'
      operationId: create_task_tasks_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedResponse'
        '400':
          description: Session is stopped or has running task
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SessionStoppedError'
                - $ref: '#/components/schemas/SessionHasRunningTaskError'
                title: Response 400 Create Task Tasks Post
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFoundError'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many concurrent active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyConcurrentActiveSessionsError'
  /tasks/{task_id}:
    get:
      tags:
      - Tasks
      summary: Get Task
      description: Get detailed task information including status, progress, steps, and file outputs.
      operationId: get_task_tasks__task_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Tasks
      summary: Update Task
      description: Control task execution with stop, pause, resume, or stop task and session actions.
      operationId: update_task_tasks__task_id__patch
      security:
      - APIKeyHeader: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNotFoundError'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /tasks/{task_id}/status:
    get:
      tags:
      - Tasks
      summary: Get Task Status
      description: 'Lightweight endpoint optimized for polling task status.


        Returns only the task status, output, and cost without loading steps,

        files, or session details. Use this endpoint for efficient polling

        instead of GET /tasks/{task_id}.


        Recommended polling pattern:

        1. POST /tasks to create a task

        2. Poll GET /tasks/{task_id}/status until status is ''finished'' or ''stopped''

        3. GET /tasks/{task_id} once at the end for full details including steps'
      operationId: get_task_status_tasks__task_id__status_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusView'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/logs:
    get:
      tags:
      - Tasks
      summary: Get Task Logs
      description: Get secure download URL for task execution logs with step-by-step details.
      operationId: get_task_logs_tasks__task_id__logs_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLogFileResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNotFoundError'
        '500':
          description: Failed to generate download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlGenerationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DownloadUrlGenerationError:
      properties:
        detail:
          type: string
          title: Detail
          default: Failed to generate download URL
      type: object
      title: DownloadUrlGenerationError
      description: Error response when download URL generation fails
    SessionSettings:
      properties:
        profileId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Profile ID
          description: Browser profile ID for persistent browser state (cookies, local storage, etc.).
        proxyCountryCode:
          anyOf:
          - $ref: '#/components/schemas/ProxyCountryCode'
          - type: 'null'
          title: Proxy Country Code
          description: Proxy country code for geo-targeted browsing. Defaults to US. Set to null to disable proxy.
          default: us
        browserScreenWidth:
          anyOf:
          - type: integer
            maximum: 6144.0
            minimum: 320.0
          - type: 'null'
          title: Browser Screen Width
          description: Custom screen width in pixels for the browser.
        browserScreenHeight:
          anyOf:
          - type: integer
            maximum: 3456.0
            minimum: 320.0
          - type: 'null'
          title: Browser Screen Height
          description: Custom screen height in pixels for the browser.
        enableRecording:
          type: boolean
          title: Enable Recording
          description: If True, enables session recording. Defaults to False.
          default: false
      type: object
      title: SessionSettings
      description: 'Session configuration for auto-created sessions.

        These settings only apply when no session_id is provided.'
    FileView:
      properties:
        id:
          type: string
          format: uuid
          title: ID
          description: Unique identifier for the output file
        fileName:
          type: string
          title: File Name
          description: Name of the output file
      type: object
      required:
      - id
      - fileName
      title: FileView
      description: View model for representing an output file generated by the agent
    HTTPValidationError:
      properties:
        detail:
