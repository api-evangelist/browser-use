    UpdateTaskRequest:
      properties:
        action:
          $ref: '#/components/schemas/TaskUpdateAction'
          title: Action
          description: The action to perform on the task
      type: object
      required:
      - action
      title: UpdateTaskRequest
      description: Request model for updating task state
    TaskCreatedResponse:
      properties:
        id:
          type: string
          format: uuid
          title: ID
