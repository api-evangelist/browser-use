deviations:
- >-
  No top-level `description` field. A2A lists description among the core AgentCard fields, and an
  agent choosing between cards has nothing to read at the card level.
- >-
  `protocolVersion` is "0.3", not "1.0.0" — the card declares the pre-1.0 protocol revision.
- >-
  `url` and every `supportedInterfaces[].url` point at https://docs.browser-use.com/, the
  documentation site, not at an A2A JSON-RPC endpoint. The card is a discovery beacon, not a callable
  A2A service address.
- >-
  `capabilities` declares streaming:false and pushNotifications:false, yet the v4 REST API does expose
  incremental run events and Browser Use ships signed webhooks. The card understates the platform.
- >-
  The single skill carries an empty `tags` array.
