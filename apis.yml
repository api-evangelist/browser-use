aid: browser-use
name: Browser Use
description: >-
  Browser Use makes websites accessible to AI agents. It ships two commercial products on one managed
  browser platform — Browser Use Agents, which take a natural-language goal and return completed web
  work, and Browser Infrastructure, which rents stealth cloud Chromium browsers over SDK, REST, or CDP
  to automation you already own. The public Cloud API is versioned (v4 for long-horizon agent runs,
  v3 for sessions and workspaces, v2 for low-cost step-based tasks), authenticates with an
  X-Browser-Use-API-Key header, and is complemented by an OAuth-protected remote MCP server, signed
  webhooks, an A2A agent card, a published agent skill, first-party Python and TypeScript SDKs, and a
  CLI. The open-source browser-use Python library is a separate developer tool with its own API.
