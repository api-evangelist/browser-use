- aid: browser-use:browser-use-mcp
  name: Browser Use MCP Server
  description: >-
    Browser Use's hosted remote Model Context Protocol server. An anonymous tools/list returns six
    real tools — browser_task, monitor_task, list_skills, execute_skill, get_cookies and
    list_browser_profiles — while calls are protected by the Browser Use OAuth authorization server
    (mcp scope) or an X-Browser-Use-API-Key header. A second, v3-shaped server is documented at
    /v3/mcp with seven session-oriented tools.
  humanURL: https://browser-use.com/mcp
  baseURL: https://api.browser-use.com/mcp
