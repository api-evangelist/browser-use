- aid: browser-use:browser-use-api-v2
  name: Browser Use Public API v2
  description: >-
    The step-priced Browser Use Cloud REST API — tasks and task logs, sessions with public share
    links, presigned file upload/download URLs, browser profiles, standalone browsers, and the Skills
    surface that turns a website workflow into a callable deterministic endpoint, plus the skills
    marketplace. 44 operations, OpenAPI 3.1.
  humanURL: https://docs.browser-use.com/cloud/api-v2-overview
  baseURL: https://api.browser-use.com/api/v2
