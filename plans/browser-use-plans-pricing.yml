description: >-
  Browser Use plans and usage rates, read verbatim from the provider's machine-readable pricing file at
  https://browser-use.com/pricing.md, which itself states it was last verified against the live V4
  contract on 2026-08-17. Credits are dollar-denominated — one credit is one US dollar of usage.
  Subscription price and included credits are equal on every paid monthly tier; what the tier actually
  buys is concurrency and features.
currency: USD
plan_count: 6
plans:
  - id: free
    name: Free
    type: freemium
    price: '0'
    billing_period: month
    included: Free browsers and 10 agent tasks per month
    limits:
      concurrent_sessions: 3
      browser_profiles: 10
      agent_tasks_per_month: 10
      managed_proxies: Basic pool
      bring_your_own_model_key: false
      bring_your_own_proxy: false
      auto_recharge: false
      scheduled_jobs: false
      captcha_solving: true
      webhook_events: true
  - id: pay-as-you-go
    name: Pay as you go
    type: usage-based
    price: null
    billing_period: none
    included: Purchased, non-expiring credits
    overage: Usage billed against purchased credits at the published rates
    limits:
      concurrent_sessions: 10
      note: Concurrency rises from 3 to 10 after the first top-up; it does not become unlimited.
      top_up_standard: ['5', '25', '50', '100', '250', '500']
      top_up_custom_range: 5-100000
      credits_expire: false
  - id: dev
    name: Dev
    type: subscription
    price: '29'
    billing_period: month
    annual_price: '290'
    annual_included_credits: '360'
    included: $29/month in credits
    limits:
      concurrent_sessions: 25
      browser_profiles: 20
      managed_proxies: Premium pool
      bring_your_own_model_key: true
      bring_your_own_proxy: true
      auto_recharge: true
      scheduled_jobs: true
  - id: business
    name: Business
    type: subscription
    price: '299'
    billing_period: month
    annual_price: '2990'
    annual_included_credits: '3600'
    included: $299/month in credits
    limits:
      concurrent_sessions: 200
      browser_profiles: unlimited
      managed_proxies: Premium pool
      bring_your_own_model_key: true
      bring_your_own_proxy: true
      auto_recharge: true
      scheduled_jobs: true
  - id: scaleup
    name: Scaleup
    type: subscription
    price: '999'
    billing_period: month
    annual_price: '9990'
    annual_included_credits: '12000'
    included: $999/month in credits
    limits:
      concurrent_sessions: 500
      browser_profiles: unlimited
      managed_proxies: Premium pool
      residential_proxy_rate_per_gb: '4'
  - id: enterprise
    name: Enterprise
    type: custom
    price: null
    billing_period: custom
    included: Negotiated annual credit pool
    limits:
      concurrent_sessions: custom
      adds: Service-level agreements, data-retention terms, dedicated support
    contact: mailto:sales@browser-use.com
usage_rates:
  - metric: cloud browser session
    price: '0.02'
    unit: browser-hour
    note: Metered by the minute, one-minute minimum, partial minutes round up. Reserved credits are returned when the browser ends.
  - metric: managed residential proxy
    price: '5'
    unit: GB
  - metric: managed residential proxy (Scaleup)
    price: '4'
    unit: GB
  - metric: direct or bring-your-own-proxy egress
    price: '0.20'
    unit: GB
  - metric: API V2 agent step
    price: '0.006'
    unit: step
  - metric: API V2 task initialization
    price: '0.01'
    unit: task
  - metric: API V3 hosted model tokens
    price: 1.2x provider token rates
    unit: multiplier
  - metric: bring-your-own-key orchestration fee
    price: 0.2x provider token cost
    unit: multiplier
